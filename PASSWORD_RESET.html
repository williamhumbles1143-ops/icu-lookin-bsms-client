<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reset ICU Lookin Password</title>
<link rel="icon" href="assets/icons/customer.png">
<script>
(function(){
  const h=new URLSearchParams(location.hash.replace(/^#/,""));
  const q=new URLSearchParams(location.search);
  window.ICU_RECOVERY_INTENT =
    h.get("type")==="recovery" ||
    q.get("type")==="recovery" ||
    q.has("code") ||
    (h.has("access_token") && h.has("refresh_token"));
})();
</script>
<style>
:root{--ink:#111;--bg:#f4f1eb;--panel:#fff;--line:#d5cec2;--blue:#173f9e;--danger:#8b1e1e}
*{box-sizing:border-box}
body{margin:0;padding:22px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:620px;margin:8vh auto}
.brand{display:flex;gap:14px;align-items:center;margin-bottom:20px}
.brand img{width:72px;height:72px;border-radius:16px;object-fit:cover}
.brand h1{font-size:1.65rem;margin:0}.brand p{margin:.35rem 0 0;color:#666}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 18px 55px rgba(0,0,0,.08)}
.field{display:grid;gap:7px;margin:16px 0}
.field input{width:100%;padding:15px;border:1px solid #999;border-radius:10px;font-size:17px}
button,a.button{display:block;width:100%;padding:16px;border:0;border-radius:12px;background:#111;color:#fff;text-decoration:none;font-weight:900;font-size:17px;text-align:center;cursor:pointer;margin-top:12px}
button:disabled{opacity:.55;cursor:not-allowed}
.secondary{background:#5c5c5c!important}
.status{min-height:1.5em;font-weight:800;color:var(--danger);margin:12px 0}
.success{color:#176b2c}
.note{color:#666;line-height:1.5}
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="assets/icu-lookin-logo.jpeg" alt="ICU Barber Studio logo">
    <div><h1>Password Recovery</h1><p>ICU Barber Studio</p></div>
  </div>
  <section class="panel">
    <h2 id="title">Reset your password</h2>
    <p id="intro" class="note">Verifying your secure recovery link…</p>
    <form id="resetForm" hidden>
      <label class="field">New password
        <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label class="field">Confirm new password
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <p class="note">Use at least 8 characters. After the reset, sign in again using your new password.</p>
      <p id="status" class="status"></p>
      <button id="saveButton" type="submit">Save New Password</button>
    </form>
    <div id="invalidActions" hidden>
      <p id="invalidMessage" class="status">This password-recovery link is invalid, expired, or has already been used.</p>
      <a class="button secondary" href="index.html">Return to ICU Barber Studio</a>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/supabase-auth.js"></script>
<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let identity=null;

async function readyRecovery(){
  if(!window.ICU_RECOVERY_INTENT){
    $("intro").textContent="This page must be opened from a new ICU Lookin password-recovery email.";
    $("invalidActions").hidden=false;
    return;
  }

  let recoveryEvent=false;
  const {data:{subscription}}=ICUAuth.client.auth.onAuthStateChange((event)=>{
    if(event==="PASSWORD_RECOVERY") recoveryEvent=true;
  });

  try{
    let session=null;
    for(let i=0;i<24;i++){
      const result=await ICUAuth.client.auth.getSession();
      if(result?.data?.session){session=result.data.session;break}
      await sleep(250);
    }

    if(!session){
      $("intro").textContent="The recovery link could not establish a secure session.";
      $("invalidActions").hidden=false;
      return;
    }

    // A recovery URL itself is required even if this browser already had another session.
    // This prevents the public reset page from becoming an unauthenticated password-change shortcut.
    try{ identity=await ICUAuth.getIdentity(); }catch(_){ identity=null; }

    $("intro").textContent="Recovery link verified. Create a new password for this ICU Lookin account.";
    $("resetForm").hidden=false;
    setTimeout(()=>$("newPassword").focus(),50);
  }catch(err){
    $("intro").textContent="The recovery link could not be verified.";
    $("invalidMessage").textContent=err?.message||"This password-recovery link is invalid or expired.";
    $("invalidActions").hidden=false;
  }finally{
    setTimeout(()=>subscription?.unsubscribe(),1000);
  }
}

$("resetForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const a=$("newPassword").value;
  const b=$("confirmPassword").value;
  if(a.length<8){$("status").textContent="Use at least 8 characters.";return}
  if(a!==b){$("status").textContent="The passwords do not match.";return}
  $("saveButton").disabled=true;
  $("status").classList.remove("success");
  $("status").textContent="Saving your new password…";
  try{
    await ICUAuth.changePassword(a);
    try{ identity=identity||await ICUAuth.getIdentity(); }catch(_){}
    const role=identity?.role||"";
    const displayName=identity?.display_name||"";
    await ICUAuth.signOut();
    $("title").textContent="Password reset complete";
    $("intro").textContent="Your new password has been saved. Sign in again with the new password.";
    $("resetForm").hidden=true;
    $("status").textContent="";
    const target="index.html";
    setTimeout(()=>location.replace(target),900);
  }catch(err){
    $("status").textContent=err?.message||"Unable to reset the password. Request a new recovery email and try again.";
    $("saveButton").disabled=false;
  }
});

readyRecovery();
</script>
</body>
</html>
