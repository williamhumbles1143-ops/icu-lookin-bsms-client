<!doctype html><html lang="en"><head><script>
(function(){
  const hashParams=new URLSearchParams(location.hash.replace(/^#/,""));
  const queryParams=new URLSearchParams(location.search);
  const recoveryIntent=
    hashParams.get("type")==="recovery" ||
    queryParams.get("type")==="recovery" ||
    queryParams.has("code") ||
    (hashParams.has("access_token") && hashParams.has("refresh_token"));
  if(recoveryIntent && !/PASSWORD_RESET\.html$/i.test(location.pathname)){
    location.replace("PASSWORD_RESET.html"+location.search+location.hash);
  }
})();
</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ICU Barber Studio</title><link rel="icon" href="assets/icons/customer.png"><style>:root{--red:#ed1c24;--blue:#173f9e;--ink:#111;--bg:#f4f1eb;--panel:#fff;--line:#d5cec2}*{box-sizing:border-box}body{margin:0;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:820px;margin:auto}.brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}.brand img{width:64px;height:64px;border-radius:14px;object-fit:cover}.brand h1{margin:0;font-size:1.45rem}.brand p{margin:.3rem 0 0;color:#666}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card,.button,button{display:block;width:100%;padding:18px;border:0;border-radius:14px;background:#111;color:#fff;text-decoration:none;font-weight:900;font-size:16px;cursor:pointer;text-align:left}.card small{display:block;font-weight:600;opacity:.78;margin-top:.35rem}.client{background:var(--red)}.barber{background:#111}.owner{background:var(--blue)}.secondary{background:#555}.danger{background:#851b1b}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions>*{width:auto}dialog{width:min(94vw,560px);border:0;border-radius:18px;padding:0;box-shadow:0 25px 80px rgba(0,0,0,.38)}dialog::backdrop{background:rgba(0,0,0,.65)}.modal{padding:22px}.modal h2{margin-top:0}.field{display:grid;gap:6px;margin:12px 0}.field input{width:100%;padding:14px;border:1px solid #999;border-radius:9px;font-size:16px}.check{display:flex;gap:9px;align-items:flex-start;margin:14px 0}.status{min-height:1.4em;color:#8b1e1e;font-weight:800}.policy-layout{display:grid;grid-template-columns:220px 1fr;gap:14px;height:min(62vh,520px)}.policy-buttons{overflow:auto;display:grid;align-content:start;gap:6px}.policy-buttons button{padding:11px;background:#444}.policy-text{overflow:auto;border:1px solid var(--line);border-radius:12px;padding:14px}.policy-text h3{margin-top:0}@media(max-width:650px){body{padding:16px}.grid{grid-template-columns:1fr}.policy-layout{grid-template-columns:1fr;grid-template-rows:180px 1fr}.actions>*{width:100%}}</style></head><body><main><div class="brand"><img src="assets/icu-lookin-logo.jpeg" alt="ICU Barber Studio logo"><div><h1>ICU Barber Studio</h1><p>Book an appointment, access your client profile, or review shop policies.</p></div></div><div class="grid"><button class="card client" id="openBooking">Customer Booking<small>New or returning clients</small></button><button class="card secondary" id="openPolicies">Shop Policies<small>Review ICU Barber Studio policies</small></button></div></main>
<dialog id="bookingModal"><div class="modal"><h2>Book an Appointment</h2><section class="panel"><h3>Returning Client</h3><p>Enter your phone number to open your existing profile.</p><label class="field">Phone<input id="returningPhone" type="tel" inputmode="tel" maxlength="14" placeholder="(555) 555-5555"></label><button id="findReturning" type="button">Find My Profile</button><p id="returningStatus" class="status"></p></section><section class="panel"><h3>New Client</h3><button id="newBooking" class="client" type="button">Start New Booking</button></section><div class="actions"><button data-close="bookingModal" class="secondary">Back</button><a class="button danger" href="index.html">Exit / Back</a></div></div></dialog>
<dialog id="policiesModal"><div class="modal"><h2>Shop Policies</h2><div class="policy-layout"><div id="policyButtons" class="policy-buttons"></div><article id="policyText" class="policy-text"><h3>Select a policy</h3><p>Choose a policy from the list.</p></article></div><div class="actions" style="margin-top:14px"><button data-close="policiesModal" class="secondary">Back</button><a class="button danger" href="index.html">Exit / Back</a></div></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script><script src="assets/supabase-data.js"></script>
<script>
const APPOINTMENTS_KEY="icuLookinAppointmentsV3",WALKIN_KEY="icuWalkinsV1",POS_KEY="icuPosTransactionsV1",SESSION="icuCustomerSessionPhoneV1";
const POLICIES={"Booking & Appointment":"Book the correct client, barber, service, date and time. Availability follows the selected barber’s saved schedule.","Cancellation":"Cancel as early as possible. A cancellation remains in appointment history and may affect the next deposit requirement.","Last Second Cancellation":"A cancellation made too close to the scheduled service time may be marked Last Second Cancellation. The next booking will require a minimum $10 non-refundable deposit because the barber did not have a reasonable opportunity to fill the vacated service time.","No-Show":"If the most recent appointment is a No Show, the next booking requires a non-refundable deposit of at least $10.","Non-Refundable Deposit":"Required deposits are non-refundable and are applied toward the scheduled service balance.","Hair & Scalp Preparation":"Please arrive with your hair and scalp clean and free of excessive oil, grease, product buildup, and debris. If your barber must clean or prepare your hair and/or scalp before the scheduled service can begin, a $5 Hair & Scalp Preparation Fee will be added to your service total.","Late Arrival":"Late arrival may shorten the service or require rescheduling when it would interfere with another appointment.","After-Hours":"Appointments starting from 7:00 PM through 9:00 PM include a $15 customer after-hours fee.","Payment & Refund":"Applicable service charges, fees, deposits and tips are shown during checkout. Non-refundable deposits are not refunded.","Walk-In":"Walk-ins are accepted according to real-time barber availability and the time available before the next appointment.","Children / Family Booking":"A primary client may book for family members saved in the profile; the family member is identified in appointment notes.","Service Adjustment / Redo":"Contact the barber promptly with a service concern so an appropriate adjustment can be discussed.","Health, Safety & Sanitation":"Clients and staff should support a clean, safe shop environment and follow reasonable sanitation directions.","Photo / Video Consent":"Client photos or videos should not be used as promotional social content without permission.","Privacy":"Client information is used for booking, appointment communication and shop operations.","Terms of Service":"Use of the booking system is subject to the shop policies shown here."};
const $=id=>document.getElementById(id),norm=v=>String(v||"").replace(/\D/g,"").slice(-10);function mask(v){const d=String(v||"").replace(/\D/g,"").slice(0,10);if(!d)return"";if(d.length<4)return`(${d}`;if(d.length<7)return`(${d.slice(0,3)}) ${d.slice(3)}`;return`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`}function rows(k){try{const a=JSON.parse(localStorage.getItem(k)||"[]");return Array.isArray(a)?a:[]}catch{return[]}}function go(target){location.href=`CUSTOMER_BOOKING_APP.html#${target}`}async function cloudKnown(p){const d=norm(p);if(d.length!==10)return false;try{const hits=await ICUCloud.customerLookup(d);if(!hits.length)return false;const current=rows(APPOINTMENTS_KEY),map=new Map(current.map(a=>[a.id,a]));hits.forEach(a=>map.set(a.id,a));localStorage.setItem(APPOINTMENTS_KEY,JSON.stringify([...map.values()]));return true}catch(error){$("returningStatus").textContent=error?.message||"Unable to reach the booking service.";return false}}
$("openBooking").onclick=async()=>{const s=sessionStorage.getItem(SESSION)||"";if(s&&await cloudKnown(s)){localStorage.setItem("icuLauncherPhone",mask(s));go("customer-profile");return}$("bookingModal").showModal()};$("openPolicies").onclick=()=>$("policiesModal").showModal();$("returningPhone").oninput=e=>e.target.value=mask(e.target.value);$("findReturning").onclick=async()=>{const p=$("returningPhone").value,d=norm(p);if(d.length!==10){$("returningStatus").textContent="Enter a complete 10-digit phone number.";return}$("returningStatus").textContent="Checking your Supabase profile…";if(await cloudKnown(p)){sessionStorage.setItem(SESSION,d);localStorage.setItem("icuLauncherPhone",mask(p));$("bookingModal").close();go("customer-profile")}else{sessionStorage.removeItem(SESSION);localStorage.setItem("icuNewClientPhone",mask(p));$("bookingModal").close();go("book")}};$("newBooking").onclick=()=>{sessionStorage.removeItem(SESSION);$("bookingModal").close();go("book")};document.addEventListener("click",e=>{const c=e.target.closest("[data-close]");if(c)document.getElementById(c.dataset.close).close();const p=e.target.closest("[data-policy]");if(p)$("policyText").innerHTML=`<h3>${p.dataset.policy}</h3><p>${POLICIES[p.dataset.policy]}</p>`});$("policyButtons").innerHTML=Object.keys(POLICIES).map(k=>`<button data-policy="${k}">${k}</button>`).join("");
</script></body></html>
