<!doctype html><html lang="en"><head><script>
(function(){
  const hashParams=new URLSearchParams(location.hash.replace(/^#/,""));
  const queryParams=new URLSearchParams(location.search);
  const recoveryIntent=
    hashParams.get("type")==="recovery" ||
    queryParams.get("type")==="recovery" ||
    queryParams.has("code") ||
    (hashParams.has("access_token") && hashParams.has("refresh_token"));
  if(recoveryIntent && !/PASSWORD_RESET\.html$/i.test(location.pathname)){
    location.replace("PASSWORD_RESET.html"+location.search+location.hash);
  }
})();
</script><meta charset="utf-8"><title>ICU Barber Studio Booking</title><link rel="icon" type="image/png" href="assets/icons/customer.png"><script>const requested=(location.hash||"#book").slice(1),target=["customer-profile","customer-loyalty","customer-gifts","book"].includes(requested)?requested:"book";sessionStorage.setItem("icuAppMode","customer");sessionStorage.removeItem("icuBarberName");sessionStorage.setItem("icuCustomerStartView",target);location.replace(`BSMS_APP.html?app=customer#${target}`);</script></head><body><p>Opening ICU Barber Studio Booking…</p><a href="BSMS_APP.html?app=customer#book">Open app</a></body></html>
